name: Flutter CI/CD

# 트리거 조건
on:
  push:
    #paths:
    #  - 'portfolio/**'  # 특정 프로젝트 폴더에서 변경 시에만 트리거
    branches: [ Development ]

# GitHub Pages 배포를 위한 필수 권한 설정
permissions:
  contents: write # 리포지토리(예: gh-pages 브랜치)에 쓸 권한
  pages: write    # GitHub Pages 배포 권한
  id-token: write # OIDC(OpenID Connect) 인증을 위한 토큰 권한 (deploy-pages 액션에서 사용)

jobs:
  # CI
  build:
    name: Build and Test Flutter App
    runs-on: ubuntu-latest
    
    # 작업 수행 디렉토리 지정
    defaults:
      run:
        working-directory: portfolio

    steps:
    # 코드 체크아웃
    - uses: actions/checkout@v4
    
    # Flutter 환경 설정
    - name: Flutter 환경 설정
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.2'
        channel: 'stable'
    
    # Flutter 버전 확인 (디버깅용)
    - name: Flutter 버전 확인
      run: flutter --version

    # 의존성 설치
    - name: 의존성 다운로드
      run: flutter pub get
    
    # 코드 정적 분석
    - name: 코드 분석
      run: dart analyze lib
    
    # 포맷팅 검사
    - name: 코드 포맷팅 검사
      run: dart format --set-exit-if-changed lib || true
    
    # 테스트 실행
#    - name: 단위 테스트 실행
#      run: flutter test
    
    # 웹 빌드 - CanvasKit
    - name: Build Web - CanvasKit 
      run: |
        echo "Building CanvasKit renderer..."
          flutter build web \
            --release \
            --base-href "/${{ github.event.repository.name }}/canvaskit/" \
            --output build-canvaskit

    # 웹 빌드 - HTML
    - name: Setup HTML renderer configuration # index.html 파일 수정하여 HTML 렌더러 사용 설정
        # 💡 이 부분이 중요해! --web-renderer 옵션 대신 index.html 파일을 수정하는 방식!
        # 기존 index.html에 <script> 태그를 추가하여 HTML 렌더러를 강제합니다.
        # sed 명령어는 `<head>` 태그 바로 뒤에 스크립트를 삽입합니다.
        # 만약 index.html 구조가 달라 에러가 나면 수동으로 파일을 수정하거나
        # 별도의 'index_html.html' 파일을 준비하여 복사하는 방법을 사용할 수 있습니다.
      run: |
          echo "Setting HTML renderer for index.html..."
          sed -i '/<head>/a <script type="text/javascript">window.flutterWebRenderer = "html";<\/script>' web/index.html
          cat web/index.html

    - name: 웹 빌드 - HTML
      run: |
          flutter build web \
            --release \
            --base-href "/${{ github.event.repository.name }}/html/" \
            --output build-html

    
    # 빌드 결과 병합
    - name: Merge builds
      run: |
          rm -rf _site 
          mkdir -p _site/html _site/canvaskit
          mv build-html/* _site/html/
          mv build-canvaskit/* _site/canvaskit/

    # 아티팩트 업로드 (선택적)
    - name: Upload GitHub Pages artifact
      uses: actions/upload-artifact@v4
      with:
        name: 'github-pages'
        path: './_site'

  # CD - Github Pages 
  deploy:
    needs: build  # build 작업 성공 후 실행
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to GitHub Pages # GitHub Pages에 최종 배포
      id: deployment
      uses: actions/deploy-pages@v4
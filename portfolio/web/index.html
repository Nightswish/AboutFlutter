<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>My Portfolio</title>
    <base href="$FLUTTER_BASE_HREF">
    <meta name="description" content="My personal portfolio built with Flutter Web" />
    <meta name="keywords" content="Flutter, Portfolio, Web, Mobile, JK" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Who" />

    <!-- Open Graph -->
    <meta property="og:title" content="My Portfolio" />
    <meta property="og:description" content="Personal portfolio website built with Flutter" />
    <meta property="og:image" content="https://username.github.io/og-image.png" />
    <meta property="og:url" content="https://username.github.io/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My Portfolio" />
    <meta name="twitter:description" content="Flutter Web 기반 포트폴리오 사이트" />
    <meta name="twitter:image" content="https://username.github.io/assets/preview.png" />

    <!-- 모바일 대응 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Manifest for PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0d47a1" />

    <!-- ⚡ GitHub Pages root 도메인 배포용 base -->
    <!-- <base href="/" /> -->
  </head>
  <body>
    <script src="flutter.js" defer></script>
    <script>
      window.addEventListener("load", function () {
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: null,
          },
          onEntrypointLoaded: function (engineInitializer) {
            engineInitializer.initializeEngine().then(function (appRunner) {
              appRunner.runApp();
            });
          },
        });
      });
    </script>
  </body>
</html>
